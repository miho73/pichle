name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "dill/**"
      - ".github/workflows/cd.yml"

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: [self-hosted, linux, ionya, user_server, pichle]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Build docker image
        shell: bash
        run: |
          test -f /home/server/pichle/config.yml
          docker build -t pichle:latest --build-arg "APP_COMMIT=${GITHUB_SHA}" -f dill/Dockerfile dill

      - name: Remove previous container
        shell: bash
        run: |
          docker stop pichle || true
          docker rm pichle || true

      - name: Create container
        shell: bash
        run: |
          mkdir -p /home/server/pichle/logs
          docker run \
            -d -q \
            --restart unless-stopped \
            -p 41001:8000 \
            -v /home/server/pichle/logs:/app/logs \
            -v /home/server/pichle/config.yml:/app/config.yml:ro \
            -e DILL_CONFIG_PATH=/app/config.yml \
            --add-host=host.docker.internal:host-gateway \
            --name pichle \
            pichle:latest
