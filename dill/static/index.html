<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#008462">
  <title>Pichle · 주문 관리</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/manager" aria-label="피클 주문 관리 홈"><span class="brand-mark" aria-hidden="true">p</span><span>Pichle</span><span class="brand-divider"></span><span class="brand-caption">매장 주문 관리</span></a>
      <div id="manager-header-tools" class="manager-header-tools" hidden>
        <div class="connection" role="status"><span id="connection-dot" class="connection-dot"></span><span id="connection-text">연결 중</span></div>
        <span id="manager-username" class="manager-username"></span>
        <button id="clear-menu-cache-button" class="logout-button menu-cache-button" type="button">메뉴 캐시 비우기</button>
        <button id="logout-button" class="logout-button" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <main id="auth-screen" class="auth-screen">
    <div id="auth-loading" class="auth-loading" role="status"><span class="loading-ring" aria-hidden="true"></span><p id="auth-loading-text">연결 확인 중</p></div>
    <section id="login-panel" class="login-panel" aria-labelledby="login-title" hidden>
      <p class="login-eyebrow">PICHLE MANAGER</p>
      <h1 id="login-title">매니저 로그인</h1>
      <div id="login-message" class="login-message" role="alert" hidden></div>
      <form id="login-form">
        <label for="login-username">아이디</label>
        <input id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="120" required>
        <label for="login-password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
        <button id="login-button" class="login-button" type="submit">로그인</button>
      </form>
      <button id="auth-retry-button" class="auth-retry-button" type="button">다시 시도</button>
    </section>
    <noscript><p class="noscript-message">주문 관리 화면을 이용하려면 브라우저의 JavaScript를 켜주세요.</p></noscript>
  </main>

  <main id="manager-workspace" class="workspace" hidden>
    <section class="page-heading" aria-labelledby="page-title">
      <div><p id="today" class="eyebrow"></p><h1 id="page-title">주문 접수</h1></div>
      <div class="store-field"><label for="store-select">매장</label><select id="store-select"><option value="">전체 매장</option></select></div>
    </section>

    <section class="overview" aria-label="주문 현황">
      <div class="overview-card"><span class="overview-label"><span class="status-dot received"></span>확인 대기</span><strong id="received-count">—</strong><span class="overview-unit">건</span></div>
      <div class="overview-card"><span class="overview-label"><span class="status-dot preparing"></span>준비 중</span><strong id="preparing-count">—</strong><span class="overview-unit">건</span></div>
      <div class="overview-card"><span class="overview-label"><span class="status-dot ready"></span>준비 완료</span><strong id="ready-count">—</strong><span class="overview-unit">건</span></div>
    </section>

    <section class="orders-panel" aria-label="주문 목록">
      <div class="toolbar">
        <div class="tabs" role="tablist" aria-label="주문 상태">
          <button class="tab is-active" type="button" role="tab" data-status="ALL" aria-selected="true" aria-controls="orders-grid">전체 <span data-count="ALL">0</span></button>
          <button class="tab" type="button" role="tab" data-status="RECEIVED" aria-selected="false" aria-controls="orders-grid" tabindex="-1">확인 대기 <span data-count="RECEIVED">0</span></button>
          <button class="tab" type="button" role="tab" data-status="PREPARING" aria-selected="false" aria-controls="orders-grid" tabindex="-1">준비 중 <span data-count="PREPARING">0</span></button>
          <button class="tab" type="button" role="tab" data-status="READY" aria-selected="false" aria-controls="orders-grid" tabindex="-1">준비 완료 <span data-count="READY">0</span></button>
          <button class="tab" type="button" role="tab" data-status="CLOSED" aria-selected="false" aria-controls="orders-grid" tabindex="-1">완료·취소 <span data-count="CLOSED">0</span></button>
        </div>
        <label class="search-field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 4.5 4.5"></path></svg><input id="order-search" type="search" placeholder="수령 코드 또는 메뉴 검색" autocomplete="off" aria-label="수령 코드 또는 메뉴 검색"></label>
      </div>
      <div class="list-meta"><p id="list-summary" role="status"></p><div class="refresh-tools"><span id="updated-at"></span><button id="refresh-button" class="text-button" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M16.5 9a6.5 6.5 0 1 0-.9 4.4M16.5 3.5V9H11"></path></svg>새로고침</button></div></div>

      <div id="sync-notice" class="notice" role="status" hidden><span>주문 연결 확인 중</span><button id="retry-button" type="button">다시 연결</button></div>
      <div id="action-notice" class="notice notice-error" role="alert" hidden><span id="action-message"></span><button id="dismiss-notice" type="button" aria-label="알림 닫기">닫기</button></div>

      <div id="orders-grid" class="orders-grid" role="tabpanel" aria-label="주문 카드"></div>
      <div id="empty-state" class="empty-state">
        <svg class="empty-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12h26v43l-6-4-7 4-7-4-6 4V12Z"></path><path d="M25 24h14M25 32h14M25 40h8M25 7h14v10H25z" fill="var(--page)"></path></svg>
        <h2 id="empty-title">주문 불러오는 중</h2>
      </div>
    </section>
  </main>
</body>
</html>
